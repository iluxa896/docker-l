version: '3.8'

# Universal Production Docker Compose Template
# Scalable, resource-bounded, non-root, log-capped setup

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
    internal: true

services:
  # Reverse Proxy / Web Server
  proxy:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    logging: *default-logging
    networks:
      - frontend-network
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - cache_tmpfs:/var/cache/nginx
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

  # Application Backend Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - frontend-network
      - backend-network
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          memory: 256M

  # Database Service (Generic Stateful Template)
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend-network
    environment:
      POSTGRES_DB: app_production
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - db_data:/var/lib/postgresql/data
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_production"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 512M

  # In-Memory Cache Service
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend-network
    command: ["redis-server", "--save", "900", "1", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M

volumes:
  db_data:
    driver: local
  cache_tmpfs:
    driver: local

secrets:
  db_password:
    file: ./secrets/db_password.txt
