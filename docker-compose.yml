version: '3.8'

x-logging-defaults: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # One-shot Laravel Initialization Service (Migrations, Cache, Dependencies)
  app-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: laravel-app:dev
    pull_policy: build
    user: "0:0"
    container_name: laravel_app_init
    logging: *default-logging
    volumes:
      - ./:/var/www/html:delegated
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/bin/bash", "./docker/php/init.sh"]
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # Laravel PHP-FPM Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: laravel-app:dev
    pull_policy: build
    container_name: laravel_app
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./:/var/www/html:delegated
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Nginx Web Server Service with Certbot SSL Support
  web:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    image: laravel-web:dev
    pull_policy: build
    container_name: laravel_web
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_NAME=${APP_NAME:-Магазин}
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/maintenance.html.template:/usr/share/nginx/html/maintenance.html.template:ro
      - ./docker/nginx/letsencrypt:/etc/letsencrypt
      - ./docker/nginx/letsencrypt-lib:/var/lib/letsencrypt
      - ./docker/nginx/letsencrypt-acme:/var/www/acme-challenge
    # Disable container healthcheck for Nginx to prevent 404 polling on custom virtual host / SSL setups
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M

  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: laravel_postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-laravel_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_password}
    command: ["postgres", "-c", "max_wal_size=1GB", "-c", "min_wal_size=80MB", "-c", "max_slot_wal_keep_size=1024MB"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laravel_user} -d ${DB_DATABASE:-laravel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Automated PostgreSQL Daily Backup Service with Strict 2-Copy Rotation
  postgres-backup:
    image: postgres:16-alpine
    container_name: laravel_postgres_backup
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-laravel_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_password}
      BACKUP_MAX_KEEP: ${DB_BACKUP_MAX_KEEP:-2}
      CRON_SCHEDULE: ${DB_BACKUP_CRON_SCHEDULE:-0 2 * * *}
      BACKUP_ON_STARTUP: ${DB_BACKUP_ON_STARTUP:-false}
    volumes:
      - ./docker/postgres/backup.sh:/usr/local/bin/backup.sh:ro
      - ./docker/postgres/entrypoint-backup.sh:/usr/local/bin/entrypoint-backup.sh:ro
      - ./docker/backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/entrypoint-backup.sh"]
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          memory: 32M


  # Redis Cache & Queue Storage Service
  redis:
    image: redis:7-alpine
    container_name: laravel_redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes --auto-aof-rewrite-percentage 100 --auto-aof-rewrite-min-size 64mb --maxmemory 200mb --maxmemory-policy volatile-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./docker/data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Laravel Artisan Queue Worker Service
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: laravel-app:dev
    pull_policy: build
    container_name: laravel_queue
    restart: unless-stopped
    logging: *default-logging
    command: php artisan queue:work redis --tries=3 --timeout=90
    # Disable the PHP-FPM healthcheck inherited from the image — queue worker
    # does not run php-fpm and port 9000 is never open here.
    healthcheck:
      disable: true
    volumes:
      - ./:/var/www/html:delegated
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app-init:
        condition: service_completed_successfully

  # Laravel Task Scheduler Service
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: laravel-app:dev
    pull_policy: build
    container_name: laravel_scheduler
    restart: unless-stopped
    logging: *default-logging
    command: php artisan schedule:work
    # Disable the PHP-FPM healthcheck inherited from the image — scheduler
    # does not run php-fpm and port 9000 is never open here.
    healthcheck:
      disable: true
    volumes:
      - ./:/var/www/html:delegated
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app-init:
        condition: service_completed_successfully

  # Dozzle Credentials Generator (Init step)
  dozzle-init:
    build:
      context: ./docker/dozzle
      dockerfile: Dockerfile.init
    pull_policy: build
    container_name: laravel_dozzle_init
    logging: *default-logging
    volumes:
      - ./docker/dozzle:/data
    environment:
      - DOZZLE_USER=${DOZZLE_USER:-admin}
      - DOZZLE_PASSWORD=${DOZZLE_PASSWORD:-secret_password}
      - DOZZLE_EMAIL=${DOZZLE_EMAIL:-admin@example.com}
    command:
      - |
        /usr/local/bin/dozzle generate ${DOZZLE_USER:-admin} --password ${DOZZLE_PASSWORD:-secret_password} --email ${DOZZLE_EMAIL:-admin@example.com} --name "Admin" > /data/users.yml

  # Lightweight Web Log Viewer Service (Dozzle)
  dozzle:
    image: amir20/dozzle:latest
    container_name: laravel_dozzle
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DOZZLE_AUTH_PROVIDER=simple
      - DOZZLE_BASE=/dozzle
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/dozzle:/data:ro
    depends_on:
      dozzle-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          memory: 32M

  # Beszel Admin Credentials Synchronizer (Init step)
  beszel-init:
    build:
      context: ./docker/beszel
      dockerfile: Dockerfile.init
    pull_policy: build
    user: "0:0"
    container_name: laravel_beszel_init
    logging: *default-logging
    volumes:
      - ./docker/data/beszel:/beszel_data
    environment:
      - BESZEL_USER_EMAIL=${BESZEL_USER_EMAIL:-admin@example.com}
      - BESZEL_USER_PASSWORD=${BESZEL_USER_PASSWORD:-secret_password}

  # Beszel Server & Container Monitoring Hub (Web UI & Historical SQLite Metrics)
  beszel:
    image: henrygd/beszel:latest
    container_name: laravel_beszel
    restart: unless-stopped
    logging: *default-logging
    environment:
      - APP_URL=${APP_URL:-http://localhost}/beszel
      - USER_EMAIL=${BESZEL_USER_EMAIL:-admin@example.com}
      - USER_PASSWORD=${BESZEL_USER_PASSWORD:-secret_password}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./docker/data/beszel:/beszel_data
      - ./docker/data/beszel_socket:/beszel_socket
    depends_on:
      beszel-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 96M
        reservations:
          memory: 32M

  # Beszel Local Metric Collector Agent (Inter-container Docker statistics via Unix socket)
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: laravel_beszel_agent
    restart: unless-stopped
    logging: *default-logging
    environment:
      - LISTEN=/beszel_socket/beszel.sock
      - KEY_FILE=/beszel_data/id_ed25519.pub
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/data/beszel_socket:/beszel_socket
      - ./docker/data/beszel:/beszel_data:ro
    depends_on:
      beszel-init:
        condition: service_completed_successfully
      beszel:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 48M
        reservations:
          memory: 16M
